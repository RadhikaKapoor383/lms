name: Update visual baselines

# Creates (or refreshes) the screenshots the "visual" CI job compares against.
# Run it from the Actions tab on your BRANCH after an intended look change
# (and once at the start, to create the first screenshots). It commits the
# new images to that branch. Check them in the pull request before merging.
#
# Screenshots depend on fonts and the operating system, so they are made here
# on Linux, not on a laptop.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install --no-audit --no-fund
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          NEXT_PUBLIC_SERVER_URI: http://localhost:8000/api/v1
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:visual:update
        working-directory: e2e
      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual
          if git diff --cached --quiet; then
            echo "Screenshots are already up to date."
          else
            git commit -m "test: update visual baselines"
            git push
          fi
